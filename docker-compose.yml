# Local / single-host deploy: API + optional Streamlit UI.
#
# 1. Copy .env.example to .env and set OPENAI_API_KEY.
# 2. Build & run:
#      docker compose up --build
#
# API-only (no chat):
#      docker compose up --build api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      MEDICAL_DATA_DIR: ${MEDICAL_DATA_DIR:-}
    restart: unless-stopped

  chat:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: Dockerfile.chat
    ports:
      - "${CHAT_PORT:-8501}:8501"
    environment:
      ORCHESTRATOR_BASE_URL: ${ORCHESTRATOR_BASE_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
